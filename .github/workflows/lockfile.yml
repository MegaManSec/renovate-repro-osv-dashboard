name: Generate pnpm lockfiles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-24.04
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate lockfiles
        run: |
          node --version
          corepack --version
          corepack enable
          for dir in cases/1-vulnerability-range-floor cases/2-lockfile-update-other-importers cases/5-lockfile-only-update cases/7-alerts-per-range; do
            (
              cd "$dir"
              printf 'resolution-mode=lowest-direct\n' > .npmrc
              pnpm --version
              pnpm install --lockfile-only --ignore-scripts
              rm .npmrc
              sed -n '/^importers:/,/^packages:/p' pnpm-lock.yaml
            )
          done

      - name: Commit lockfiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cases/*/pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'Add pnpm lockfiles for cases 1, 2, 5 and 7'
          git push origin HEAD:main
